<!DOCTYPE html>
<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>권용우</title>
    <!-- 구글 레트로 폰트 (Press Start 2P & Diphylleia) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Galmuri10:wght@400;700&amp;display=swap" rel="stylesheet">
    
    <style>
        /* ==================== Reset & Color Variables ==================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        :root {
            --bg-dark: #0a051b;
            --bg-card: #160a33;
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --neon-purple: #9d00ff;
            --pixel-white: #ffffff;
            --text-gray: #a09cb0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--pixel-white);
            font-family: 'Galmuri10', 'Press Start 2P', monospace, sans-serif;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            padding-bottom: 50px;
            /* 레트로 격자 배경 */
            background-image: 
                linear-gradient(rgba(255, 0, 127, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 0, 127, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Scanline CRT 효과 */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        /* 캔버스 (마우스 트레일 & 이펙트) */
        #trailCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 998;
        }

        /* Container Layout */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            position: relative;
            z-index: 10;
        }

        /* Common Retro Pixel Box */
        .pixel-box {
            background: var(--bg-card);
            border: 4px solid var(--neon-cyan);
            box-shadow: 
                0 0 0 4px #000,
                0 0 15px rgba(0, 243, 255, 0.4),
                inset 0 0 10px rgba(0, 243, 255, 0.2);
            padding: 20px;
            border-radius: 4px;
            position: relative;
        }

        .section-title {
            font-size: 1.3rem;
            color: var(--neon-yellow);
            text-shadow: 2px 2px 0px #000, 0 0 8px var(--neon-yellow);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ==================== Header Section ==================== */
        header {
            text-align: center;
            padding: 30px 10px 10px;
        }

        .sub-header {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 5px var(--neon-cyan);
            margin-bottom: 12px;
            font-family: 'Press Start 2P', monospace;
        }

        /* 통통 튀는 별명 애니메이션 */
        .bouncing-nickname {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--neon-pink);
            text-shadow: 3px 3px 0px #000, -2px -2px 0px var(--neon-yellow), 0 0 15px var(--neon-pink);
            margin: 10px 0;
        }

        .bouncing-nickname span {
            display: inline-block;
            animation: pixelBounce 0.8s infinite alternate ease-in-out;
        }

        /* 각 글자별 키프레임 딜레이 */
        .bouncing-nickname span:nth-child(1) { animation-delay: 0.0s; }
        .bouncing-nickname span:nth-child(2) { animation-delay: 0.15s; }
        .bouncing-nickname span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes pixelBounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-16px); }
        }

        .status-badge {
            display: inline-block;
            background: #000;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 6px 14px;
            font-size: 0.8rem;
            margin-top: 10px;
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ==================== Cards Section (Favorite Things) ==================== */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .flip-card {
            background-color: transparent;
            height: 220px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
            border: 3px solid var(--neon-purple);
            box-shadow: 0 0 10px rgba(157, 0, 255, 0.4);
        }

        .card-front {
            background: linear-gradient(135deg, #180938 0%, #0d0520 100%);
        }

        .card-front .icon {
            font-size: 3.5rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6));
        }

        .card-front .card-title {
            font-size: 1.2rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .card-front .tap-hint {
            font-size: 0.75rem;
            color: var(--text-gray);
            margin-top: 12px;
        }

        .card-back {
            background: linear-gradient(135deg, #2a0845 0%, #16002c 100%);
            border-color: var(--neon-pink);
            box-shadow: 0 0 12px rgba(255, 0, 127, 0.5);
            transform: rotateY(180deg);
        }

        .card-back .reason-title {
            font-size: 1rem;
            color: var(--neon-yellow);
            margin-bottom: 10px;
            border-bottom: 2px dashed var(--neon-yellow);
            padding-bottom: 4px;
        }

        .card-back .reason-desc {
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--pixel-white);
            word-break: keep-all;
        }

        /* ==================== Quiz Section ==================== */
        .quiz-container {
            text-align: center;
            border-color: var(--neon-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        .quiz-question {
            font-size: 1.2rem;
            margin: 15px 0 25px;
            color: #fff;
            text-shadow: 0 0 6px #fff;
            word-break: keep-all;
        }

        .quiz-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .retro-btn {
            background: #000;
            color: var(--neon-cyan);
            border: 3px solid var(--neon-cyan);
            font-family: inherit;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 12px 30px;
            cursor: pointer;
            box-shadow: 4px 4px 0px var(--neon-cyan);
            transition: all 0.1s ease;
            position: relative;
            outline: none;
        }

        .retro-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0px var(--neon-cyan);
        }

        .retro-btn.btn-pink {
            color: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 4px 4px 0px var(--neon-pink);
        }
        .retro-btn.btn-pink:active {
            box-shadow: 1px 1px 0px var(--neon-pink);
        }

        .quiz-result {
            margin-top: 20px;
            font-size: 1.1rem;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 4px;
        }

        /* 화면 흔들림 애니메이션 */
        .shake-screen {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }

        /* ==================== Fortune Section ==================== */
        .fortune-container {
            text-align: center;
            border-color: var(--neon-yellow);
            box-shadow: 0 0 15px rgba(255, 230, 0, 0.3);
        }

        .fortune-display {
            background: #000;
            border: 2px dashed var(--neon-yellow);
            padding: 20px;
            margin: 20px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            color: var(--neon-yellow);
            line-height: 1.6;
            word-break: keep-all;
            text-shadow: 0 0 5px var(--neon-yellow);
        }

        /* ==================== Mash Mini Game Section ==================== */
        .game-container {
            text-align: center;
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
        }

        .game-stats {
            display: flex;
            justify-content: space-around;
            background: #000;
            border: 2px solid var(--neon-green);
            padding: 12px;
            margin: 16px 0;
            font-size: 0.95rem;
        }

        .stat-item span {
            color: var(--neon-green);
            font-weight: bold;
        }

        .mash-btn-area {
            margin: 20px 0;
        }

        .mash-btn {
            width: 100%;
            max-width: 320px;
            height: 90px;
            font-size: 1.4rem;
            color: #000;
            background: var(--neon-green);
            border: 4px solid #fff;
            box-shadow: 0 6px 0 #009933, 0 0 15px var(--neon-green);
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            border-radius: 8px;
            transition: transform 0.05s ease;
        }

        .mash-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #009933, 0 0 15px var(--neon-green);
        }

        .mash-btn:disabled {
            background: #444;
            color: #888;
            border-color: #666;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .high-score {
            font-size: 0.85rem;
            color: var(--neon-cyan);
            margin-top: 8px;
        }

        /* ==================== Responsive Style ==================== */
        @media (max-width: 600px) {
            .container {
                padding: 12px;
                gap: 20px;
            }
            .bouncing-nickname {
                font-size: 2.2rem;
            }
            .section-title {
                font-size: 1.1rem;
            }
            .retro-btn {
                padding: 10px 20px;
                font-size: 1.1rem;
            }
            .mash-btn {
                height: 80px;
                font-size: 1.2rem;
            }
            .flip-card {
                height: 190px;
            }
        }
    </style>
